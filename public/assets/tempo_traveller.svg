<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <!-- Background Gradient (Ooty Hills & Sky) -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a7bd5"/>
      <stop offset="50%" stop-color="#3a6073"/>
      <stop offset="100%" stop-color="#e2d1c3"/>
    </linearGradient>

    <!-- Mountain Gradient 1 -->
    <linearGradient id="mountainGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2d5a27"/>
      <stop offset="100%" stop-color="#1b3b18"/>
    </linearGradient>

    <!-- Mountain Gradient 2 -->
    <linearGradient id="mountainGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#417639"/>
      <stop offset="100%" stop-color="#24471f"/>
    </linearGradient>

    <!-- Road Gradient -->
    <linearGradient id="roadGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4a5568"/>
      <stop offset="100%" stop-color="#2d3748"/>
    </linearGradient>

    <!-- Minibus Body Metallic White Gradient -->
    <linearGradient id="vanBody" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="70%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>

    <!-- Glass Tint Gradient -->
    <linearGradient id="glassTint" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Chrome Grille Gradient -->
    <linearGradient id="chromeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>

    <!-- Gold Accent Stripe -->
    <linearGradient id="goldStripe" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    
    <!-- Shadow -->
    <radialGradient id="dropShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- SKY BACKGROUND -->
  <rect width="800" height="600" fill="url(#skyGrad)"/>

  <!-- SCENIC OOTY MOUNTAINS & TEA GARDENS -->
  <path d="M0,320 Q200,220 400,280 T800,250 L800,600 L0,600 Z" fill="url(#mountainGrad1)"/>
  <path d="M0,360 Q250,280 500,340 T800,310 L800,600 L0,600 Z" fill="url(#mountainGrad2)"/>
  
  <!-- TEA ESTATE LINES -->
  <path d="M-50,380 C150,340 350,410 850,340" stroke="#529442" stroke-width="6" fill="none" opacity="0.6"/>
  <path d="M-50,410 C200,370 400,440 850,370" stroke="#529442" stroke-width="8" fill="none" opacity="0.6"/>

  <!-- MOUNTAIN ROAD -->
  <polygon points="0,520 800,440 800,600 0,600" fill="url(#roadGrad)"/>
  <path d="M0,560 Q400,500 800,520" stroke="#f59e0b" stroke-width="4" stroke-dasharray="25,20" fill="none" opacity="0.8"/>

  <!-- VEHICLE SHADOW -->
  <ellipse cx="430" cy="535" rx="340" ry="35" fill="url(#dropShadow)"/>

  <!-- FORCE TEMPO TRAVELLER MINIBUS (EXTERIOR SIDE/3D VIEW) -->
  <g id="tempoTravellerVan">
    <!-- Main High-Roof Body Frame -->
    <path d="M 120 310 
             C 120 280, 160 250, 240 248 
             L 660 248 
             C 710 248, 735 270, 740 310 
             L 745 460 
             C 745 480, 730 495, 700 495 
             L 150 495 
             C 130 495, 120 480, 120 450 
             Z" fill="url(#vanBody)" stroke="#cbd5e1" stroke-width="2"/>

    <!-- High Roof Extender Cap (Tempo Traveller Feature) -->
    <path d="M 230 248 C 240 230, 280 222, 350 222 L 640 222 C 670 222, 680 235, 685 248 Z" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>

    <!-- Roof Mounted AC Unit -->
    <rect x="360" y="208" width="180" height="16" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/>
    <line x1="380" y1="214" x2="520" y2="214" stroke="#64748b" stroke-width="2" stroke-dasharray="6,4"/>

    <!-- Front Windshield Glass -->
    <path d="M 135 315 C 145 285, 175 260, 225 260 L 250 260 L 250 375 L 135 375 Z" fill="url(#glassTint)" stroke="#334155" stroke-width="2"/>
    <path d="M 145 320 C 150 300, 170 275, 215 275" stroke="#ffffff" stroke-width="3" opacity="0.4" stroke-linecap="round"/>

    <!-- Side Passenger Windows (Large Tour Bus Glass Panels) -->
    <!-- Driver Window -->
    <rect x="260" y="260" width="80" height="110" rx="6" fill="url(#glassTint)" stroke="#334155" stroke-width="2"/>
    <!-- Passenger Window 1 -->
    <rect x="350" y="260" width="115" height="110" rx="6" fill="url(#glassTint)" stroke="#334155" stroke-width="2"/>
    <!-- Passenger Window 2 -->
    <rect x="475" y="260" width="115" height="110" rx="6" fill="url(#glassTint)" stroke="#334155" stroke-width="2"/>
    <!-- Rear Window 3 -->
    <path d="M 600 260 L 715 260 C 725 260, 730 280, 730 310 L 730 370 L 600 370 Z" fill="url(#glassTint)" stroke="#334155" stroke-width="2"/>

    <!-- Window Glass Glare Highlights -->
    <line x1="270" y1="270" x2="320" y2="340" stroke="#ffffff" stroke-width="3" opacity="0.3"/>
    <line x1="365" y1="270" x2="445" y2="350" stroke="#ffffff" stroke-width="3" opacity="0.3"/>
    <line x1="490" y1="270" x2="570" y2="350" stroke="#ffffff" stroke-width="3" opacity="0.3"/>
    <line x1="615" y1="270" x2="695" y2="350" stroke="#ffffff" stroke-width="3" opacity="0.3"/>

    <!-- Pushback Seats visible inside window -->
    <rect x="370" y="310" width="22" height="35" rx="4" fill="#3b82f6" opacity="0.7"/>
    <rect x="420" y="310" width="22" height="35" rx="4" fill="#3b82f6" opacity="0.7"/>
    <rect x="495" y="310" width="22" height="35" rx="4" fill="#3b82f6" opacity="0.7"/>
    <rect x="545" y="310" width="22" height="35" rx="4" fill="#3b82f6" opacity="0.7"/>
    <rect x="620" y="310" width="22" height="35" rx="4" fill="#3b82f6" opacity="0.7"/>

    <!-- Gold & Dark Green Tourist Stripes -->
    <path d="M 125 410 L 740 410 L 738 422 L 123 422 Z" fill="url(#goldStripe)"/>
    <path d="M 122 426 L 738 426 L 736 434 L 121 434 Z" fill="#0f382c"/>

    <!-- Side Door Handle & Slide Track -->
    <rect x="345" y="380" width="375" height="4" fill="#64748b"/>
    <rect x="470" y="390" width="16" height="8" rx="2" fill="#334155"/>
    <rect x="255" y="390" width="14" height="7" rx="2" fill="#334155"/>

    <!-- Front Bumper & Headlights -->
    <path d="M 120 430 Q 115 460 135 480 L 230 480 L 230 425 Z" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1"/>
    <!-- Chrome Grille & Force Logo -->
    <rect x="125" y="435" width="40" height="28" rx="4" fill="url(#chromeGrad)" stroke="#475569"/>
    <line x1="125" y1="442" x2="165" y2="442" stroke="#334155" stroke-width="2"/>
    <line x1="125" y1="449" x2="165" y2="449" stroke="#334155" stroke-width="2"/>
    <line x1="125" y1="456" x2="165" y2="456" stroke="#334155" stroke-width="2"/>
    
    <!-- Bright Xenon Headlight -->
    <ellipse cx="138" cy="425" rx="14" ry="10" fill="#fef08a" stroke="#eab308" stroke-width="2"/>
    <ellipse cx="138" cy="425" rx="8" ry="6" fill="#ffffff"/>

    <!-- Front & Rear Wheels (Dual Heavy Axle Look) -->
    <!-- Front Wheel -->
    <g id="frontWheel">
      <circle cx="230" cy="495" r="48" fill="#1e293b"/>
      <circle cx="230" cy="495" r="32" fill="url(#chromeGrad)" stroke="#475569" stroke-width="2"/>
      <circle cx="230" cy="495" r="14" fill="#0f172a"/>
      <circle cx="230" cy="495" r="6" fill="#94a3b8"/>
    </g>

    <!-- Rear Twin Wheels -->
    <g id="rearWheel">
      <circle cx="630" cy="495" r="48" fill="#1e293b"/>
      <circle cx="630" cy="495" r="32" fill="url(#chromeGrad)" stroke="#475569" stroke-width="2"/>
      <circle cx="630" cy="495" r="14" fill="#0f172a"/>
      <circle cx="630" cy="495" r="6" fill="#94a3b8"/>
    </g>
    
    <!-- Wheel Mudguards -->
    <path d="M 175 495 A 55 55 0 0 1 285 495" fill="none" stroke="#334155" stroke-width="6"/>
    <path d="M 575 495 A 55 55 0 0 1 685 495" fill="none" stroke="#334155" stroke-width="6"/>

    <!-- JC CABS BRAND BADGE ON BUS -->
    <rect x="360" y="445" width="220" height="32" rx="6" fill="#0f382c"/>
    <text x="470" y="466" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="1">
      JC CABS TEMPO TRAVELLER
    </text>
  </g>

  <!-- OVERLAY SEATER BADGE -->
  <g transform="translate(40, 40)">
    <rect width="260" height="42" rx="21" fill="#0f382c" opacity="0.9"/>
    <text x="130" y="26" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">
      🚌 12 / 14 / 26 SEATER LUXURY
    </text>
  </g>
</svg>
