<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 100" width="120" height="100">
  <defs>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFD13B"/>
      <stop offset="100%" stop-color="#F5A623"/>
    </linearGradient>
    <linearGradient id="roadGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7C948"/>
      <stop offset="100%" stop-color="#E09B19"/>
    </linearGradient>
    <linearGradient id="mntGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E4D40"/>
      <stop offset="100%" stop-color="#0F2F28"/>
    </linearGradient>
    <linearGradient id="mntGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2D6A5A"/>
      <stop offset="100%" stop-color="#164037"/>
    </linearGradient>
  </defs>

  <!-- Sun -->
  <circle cx="85" cy="40" r="18" fill="url(#sunGrad)"/>

  <!-- Back Mountain -->
  <path d="M 45 65 L 75 25 L 110 68 Z" fill="url(#mntGrad1)"/>

  <!-- Front Mountain Range -->
  <path d="M 5 70 L 40 32 L 80 72 Z" fill="url(#mntGrad2)"/>

  <!-- Winding Road -->
  <path d="M 115 85 C 80 85, 60 70, 35 60 C 20 54, 10 52, 2 55 L 2 62 C 12 59, 22 61, 35 67 C 55 76, 75 92, 115 92 Z" fill="url(#roadGrad)"/>

  <!-- Car Illustration -->
  <g transform="translate(18, 50) scale(0.42)">
    <!-- Car Body -->
    <path d="M 5 32 C 8 20, 20 12, 38 10 C 55 8, 72 15, 85 24 L 105 28 C 112 30, 118 35, 118 42 L 118 48 C 118 52, 112 55, 105 55 L 5 55 C 2 55, 0 50, 0 45 Z" fill="#FFFFFF" stroke="#0F2F28" stroke-width="3"/>
    <!-- Windshield -->
    <path d="M 32 15 Q 52 11, 72 22 L 30 22 Z" fill="#164037"/>
    <!-- Headlight -->
    <ellipse cx="110" cy="38" rx="6" ry="4" fill="#FFD13B"/>
    <!-- Wheels -->
    <circle cx="25" cy="52" r="10" fill="#1E2522" stroke="#FFFFFF" stroke-width="2"/>
    <circle cx="92" cy="52" r="10" fill="#1E2522" stroke="#FFFFFF" stroke-width="2"/>
  </g>
</svg>
